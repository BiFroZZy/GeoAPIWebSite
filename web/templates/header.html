{{ define "header" }}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>GeoInfo | Travel to Tatarstan</title>
</head>
<body>

<header class="hero-header">
    <div class="bg-slideshow"></div>
    <div class="header-overlay"></div>
    
    <div class="header-content">
        <h1 class="glow-title">
            <i class="fas fa-map-marked-alt"></i> 
            TravelToTatarstan 
            <span class="subtitle">— see our culture!</span>
        </h1>
        
        <nav class="main-nav">
            <div class="nav-links">
                <a href="/" class="nav-btn">
                    <i class="fas fa-home"></i>
                    <span>Главная страница</span>
                </a>
                <a href="/about" class="nav-btn">
                    <i class="fas fa-info-circle"></i>
                    <span>Информация о нас</span>
                </a>
            </div>
        </nav>
    </div>
</header>



<style>.hero-header {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    overflow: hidden;
    background-color: black;
}

.bg-slideshow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-size: cover;
    z-index: 0;
}

.header-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1;
}

.header-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
}

.glow-title {
    font-size: 3.5rem;
    margin-bottom: 2rem;
    text-shadow: 0 0 20px rgba(0,0,0,0.5);
    animation: fadeInDown 1s ease;
}

.glow-title .subtitle {
    font-size: 1.8rem;
    display: block;
    color: #ffd700;
}

.nav-links {
    display: flex;
    gap: 2rem;
    justify-content: center;
    flex-wrap: wrap;
}

.nav-btn {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 1rem 2rem;
    border-radius: 50px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
}

.nav-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

{{ end }}
